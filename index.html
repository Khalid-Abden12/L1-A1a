<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات الألماني ↔ العربي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181f;
    --panel:#1b232c;
    --panel-2:#222d38;
    --line: rgba(237,234,227,0.10);
    --paper:#EDEAE3;
    --paper-dim: rgba(237,234,227,0.62);
    --gold:#e2a545;
    --gold-dim: rgba(226,165,69,0.16);
    --teal:#4bb3ad;
    --teal-dim: rgba(75,179,173,0.16);
    --bad:#e26a5f;
    --bad-dim: rgba(226,106,95,0.14);
    --good:#6fbf8b;
    --good-dim: rgba(111,191,139,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(226,165,69,0.10), transparent 45%),
      radial-gradient(circle at 90% 110%, rgba(75,179,173,0.12), transparent 45%),
      var(--ink);
    min-height:100vh;
    color:var(--paper);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{ width:100%; max-width:720px; }

  /* ---------- header ---------- */
  header{ text-align:center; margin-bottom:22px; }
  .eyebrow{
    font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--paper-dim); font-family:'IBM Plex Sans Arabic', sans-serif;
    margin-bottom:8px; direction:rtl;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 18px;
    color:var(--paper); letter-spacing:.01em;
  }
  h1 .ar-word{ font-family:'Amiri', serif; }

  /* ---------- direction switch (signature element) ---------- */
  .switch{
    display:flex; align-items:center; justify-content:center; gap:0;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:5px; position:relative; max-width:420px; margin:0 auto;
  }
  .switch button{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:11px 10px; border-radius:999px; font-size:14.5px; font-weight:600;
    color:var(--paper-dim); font-family:'IBM Plex Sans Arabic', sans-serif;
    position:relative; z-index:2; transition:color .25s ease;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .switch button.active{ color:var(--ink); }
  .switch .thumb{
    position:absolute; top:5px; bottom:5px; width:calc(50% - 5px);
    border-radius:999px; z-index:1; transition:transform .3s cubic-bezier(.65,0,.35,1), background .3s ease;
    background: var(--gold);
  }
  .switch[data-mode="de-ar"] .thumb{ transform:translateX(calc(-100% - 0px)); background:var(--teal); }
  .switch[data-mode="ar-de"] .thumb{ transform:translateX(0); background:var(--gold); }
  html[dir="rtl"] .switch[data-mode="de-ar"] .thumb{ transform:translateX(calc(100% + 0px)); }
  html[dir="rtl"] .switch[data-mode="ar-de"] .thumb{ transform:translateX(0); }

  /* ---------- progress ---------- */
  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:22px 0 8px; font-size:13.5px; color:var(--paper-dim);
  }
  .progress-track{
    height:6px; border-radius:999px; background:var(--panel-2); overflow:hidden; margin-bottom:4px;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--teal), var(--gold));
    transition:width .35s ease;
  }

  /* ---------- card ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 22px; margin-top:16px; box-shadow:0 20px 40px -24px rgba(0,0,0,.6);
  }
  .speaker{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
    color:var(--ink); background:var(--paper); padding:3px 11px; border-radius:999px;
    margin-bottom:14px; direction:ltr; font-family:'IBM Plex Sans Arabic', sans-serif;
  }
  .prompt{
    font-size:23px; line-height:1.6; min-height:64px; display:flex; align-items:center;
    margin-bottom:20px;
  }
  .prompt[dir="rtl"]{ font-family:'Amiri', serif; font-size:26px; }
  .prompt[dir="ltr"]{ font-family:'Fraunces', serif; font-weight:500; }

  .answer-label{ font-size:12.5px; color:var(--paper-dim); margin-bottom:8px; }
  .answer-row{ display:flex; gap:10px; }
  input[type=text]{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; color:var(--paper); font-size:17px; outline:none;
    font-family:'IBM Plex Sans Arabic', sans-serif; transition:border-color .2s ease, background .2s ease;
  }
  input[type=text][dir="ltr"]{ font-family:'Fraunces', serif; }
  input[type=text][dir="rtl"]{ font-family:'Amiri', serif; }
  input[type=text]:focus{ border-color:var(--gold); background:var(--panel); }
  input[type=text].wrong{ border-color:var(--bad); }
  input[type=text].right{ border-color:var(--good); }

  button.check{
    border:none; border-radius:12px; padding:0 22px; font-size:15px; font-weight:600;
    cursor:pointer; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif; transition:transform .12s ease, opacity .2s ease;
  }
  button.check:hover{ opacity:.9; }
  button.check:active{ transform:scale(.97); }

  .feedback{ margin-top:16px; border-radius:14px; padding:14px 16px; font-size:14.5px; line-height:1.9; display:none; }
  .feedback.show{ display:block; }
  .feedback.bad{ background:var(--bad-dim); border:1px solid rgba(226,106,95,0.35); }
  .feedback.good{ background:var(--good-dim); border:1px solid rgba(111,191,139,0.35); }
  .feedback b{ color:var(--paper); }
  .feedback .row{ margin-bottom:4px; }
  .feedback .row:last-child{ margin-bottom:0; }
  .feedback .tag{ display:inline-block; min-width:88px; color:var(--paper-dim); font-size:12.5px; }

  .nav-row{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:10px; }
  .nav-btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--paper);
    border-radius:12px; padding:11px 16px; font-size:14px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:6px; transition:border-color .2s ease;
  }
  .nav-btn:hover{ border-color:var(--gold); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .nav-btn.next{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600; }

  /* ---------- dot map ---------- */
  .dotmap-wrap{ margin-top:26px; }
  .dotmap-label{ font-size:12.5px; color:var(--paper-dim); margin-bottom:10px; }
  .dotmap{
    display:flex; flex-wrap:wrap; gap:7px; max-height:118px; overflow-y:auto; padding:2px;
  }
  .dot{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--paper-dim); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-family:'IBM Plex Sans Arabic', sans-serif; transition:transform .12s ease;
  }
  .dot:hover{ transform:translateY(-2px); }
  .dot.current{ border-color:var(--paper); color:var(--paper); }
  .dot.correct{ background:var(--good-dim); color:var(--good); border-color:rgba(111,191,139,.4); }
  .dot.incorrect{ background:var(--bad-dim); color:var(--bad); border-color:rgba(226,106,95,.4); }

  footer{ text-align:center; margin-top:28px; font-size:12px; color:var(--paper-dim); }

  @media (max-width:480px){
    .prompt{ font-size:20px; }
    .prompt[dir="rtl"]{ font-size:22px; }
    .answer-row{ flex-direction:column; }
    button.check{ padding:13px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">تمرين مفردات وحوارات — ألماني · عربي</div>
    <h1>بطاقات <span class="ar-word">الألماني</span> ↔ Deutsch</h1>
    <div class="switch" id="switch" data-mode="ar-de">
      <div class="thumb"></div>
      <button id="btn-ar-de" class="active">عربي → ألماني</button>
      <button id="btn-de-ar">ألماني → عربي</button>
    </div>
  </header>

  <div class="progress-row">
    <span id="progress-text">السؤال 1 من 44</span>
    <span id="score-text">صحيح: 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:2%"></div></div>

  <div class="card">
    <div id="speaker" class="speaker" style="display:none"></div>
    <div id="prompt" class="prompt" dir="rtl"></div>

    <div class="answer-label" id="answer-label">اكتب الترجمة بالألمانية:</div>
    <div class="answer-row">
      <input type="text" id="answer-input" dir="ltr" autocomplete="off" spellcheck="false">
      <button class="check" id="check-btn">تحقق</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="nav-row">
      <button class="nav-btn" id="prev-btn">◀ السابق</button>
      <button class="nav-btn next" id="next-btn">التالي ▶</button>
    </div>
  </div>

  <div class="dotmap-wrap">
    <div class="dotmap-label">انتقل إلى أي سؤال:</div>
    <div class="dotmap" id="dotmap"></div>
  </div>

  <footer>الإجابات المحفوظة تبقى أثناء الجلسة حتى لو أخطأت — يمكنك العودة ومراجعتها.</footer>
</div>

<script>
const ITEMS = [
  {sp:"Alex", de:"Hallo! Wie geht's dir?", ar:"مرحبًا! كيف حالك؟"},
  {sp:"Julia", de:"Auch gut, danke. Und dir?", ar:"أنا بخير أيضًا، شكرًا. وأنتَ؟"},
  {sp:"Alex", de:"Sehr gut! Wer bist du?", ar:"جيد جدًا! من أنتِ؟"},
  {sp:"Julia", de:"Ich bin Julia. Und du?", ar:"أنا يوليا. وأنتَ؟"},
  {sp:"Alex", de:"Wie heißt du?", ar:"ما اسمكِ؟"},
  {sp:"Julia", de:"Ich heiße Julia. Woher kommst du?", ar:"اسمي يوليا. من أين أنتَ؟"},
  {sp:"Alex", de:"Ich komme aus Deutschland. Wo wohnst du?", ar:"أنا من ألمانيا. أين تسكنين؟"},
  {sp:"Julia", de:"Ich wohne in Frankfurt.", ar:"أنا أسكن في فرانكفورت."},
  {sp:"Alex", de:"Welche Sprachen sprichst du?", ar:"ما اللغات التي تتحدثينها؟"},
  {sp:"Julia", de:"Ich spreche Spanisch, Englisch und Deutsch. Und du?", ar:"أتحدث الإسبانية والإنجليزية والألمانية. وأنتَ؟"},
  {sp:"Alex", de:"Ich spreche Deutsch.", ar:"أتحدث الألمانية."},
  {sp:"Julia", de:"Wie ist deine Telefonnummer?", ar:"ما هو رقم هاتفك؟"},
  {sp:"Alex", de:"Meine Telefonnummer ist 0176 12345678.", ar:"رقم هاتفي هو 0176 12345678."},
  {sp:"Julia", de:"Wie ist deine Handynummer?", ar:"ما هو رقم جوالك؟"},
  {sp:"Alex", de:"0176 12345678.", ar:"0176 12345678."},
  {sp:"Julia", de:"Und wie ist deine E-Mail-Adresse?", ar:"وما هو بريدك الإلكتروني؟"},
  {sp:"Alex", de:"alexis_barbos@quinnet.com.", ar:"alexis_barbos@quinnet.com"},
  {sp:"Julia", de:"Wie bitte? Kannst du das buchstabieren?", ar:"عفوًا؟ هل يمكنك تهجئته؟"},
  {sp:"Alex", de:"Alexis Unterstrich Barbos, Punkt com.", ar:"أليكسيس، شرطة سفلية، باربوس، نقطة كوم."},
  {sp:"Julia", de:"Entschuldigung, noch einmal bitte.", ar:"عفوًا، مرة أخرى من فضلك."},
  {sp:"Alex", de:"Kein Problem.", ar:"لا مشكلة."},
  {sp:"Julia", de:"Das verstehe ich nicht. Bitte ein bisschen langsamer.", ar:"أنا لا أفهم ذلك. من فضلك، ببطء أكثر قليلاً."},
  {sp:"Alex", de:"Frau Lang, woher kommen Sie?", ar:"سيدة لانج، من أين أنتِ؟"},
  {sp:"Frau Lang", de:"Ich komme aus Deutschland.", ar:"أنا من ألمانيا."},
  {sp:"Julia", de:"Tschüs! Bis bald!", ar:"مع السلامة! أراك قريبًا!"},
  {sp:"Alex", de:"Ciao! Auf Wiedersehen!", ar:"سلام! إلى اللقاء!"},

  {sp:null, de:"Das Handtuch ist neu.", ar:"المنشفة جديدة."},
  {sp:null, de:"Das Würstel ist gut.", ar:"النقانق جيدة."},
  {sp:null, de:"Die Flasche ist leer.", ar:"الزجاجة فارغة."},
  {sp:null, de:"Der Kindergarten ist groß.", ar:"روضة الأطفال كبيرة."},
  {sp:null, de:"Der Koffer ist schwer.", ar:"الحقيبة ثقيلة."},
  {sp:null, de:"Das Butterbrot ist lecker.", ar:"الساندويتش لذيذ."},
  {sp:null, de:"Der Kranke ist im Krankenhaus.", ar:"المريض في المستشفى."},
  {sp:null, de:"Die Autobahn ist lang.", ar:"الطريق السريع طويل."},
  {sp:null, de:"Die Nudeln sind gut.", ar:"المعكرونة جيدة."},
  {sp:null, de:"Ich spreche Deutsch, aber ich spreche kein Französisch.", ar:"أتحدث الألمانية، لكنني لا أتحدث الفرنسية."},

  {sp:null, de:"At-Zeichen", ar:"علامة @ (أت)"},
  {sp:null, de:"Punkt", ar:"نقطة"},
  {sp:null, de:"Minus", ar:"شرطة (مينوس)"},
  {sp:null, de:"Unterstrich", ar:"شرطة سفلية"},

  {sp:null, de:"Name", ar:"الاسم"},
  {sp:null, de:"Land", ar:"البلد"},
  {sp:null, de:"Stadt", ar:"المدينة"},
  {sp:null, de:"Sprachen", ar:"اللغات"},
];

let mode = "ar-de"; // ar-de: show Arabic, type German | de-ar: show German, type Arabic
let current = 0;
// state[mode][index] = {status:'correct'|'incorrect', typed:'...'}
const state = { "ar-de": ITEMS.map(()=>({status:null, typed:""})),
                "de-ar": ITEMS.map(()=>({status:null, typed:""})) };

const el = (id)=>document.getElementById(id);
const promptEl = el('prompt');
const speakerEl = el('speaker');
const inputEl = el('answer-input');
const feedbackEl = el('feedback');
const answerLabelEl = el('answer-label');
const progressText = el('progress-text');
const scoreText = el('score-text');
const progressFill = el('progress-fill');
const dotmap = el('dotmap');
const switchEl = el('switch');

function normalize(s){
  return s
    .toLowerCase()
    .replace(/[!?.,;:؟،؛«»"'ʼ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function buildDots(){
  dotmap.innerHTML = "";
  ITEMS.forEach((it, i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i+1;
    d.addEventListener('click', ()=>{ current = i; render(); });
    dotmap.appendChild(d);
  });
}

function updateDots(){
  const dots = dotmap.children;
  for(let i=0;i<ITEMS.length;i++){
    const st = state[mode][i].status;
    dots[i].className = 'dot' + (i===current ? ' current' : '') +
      (st==='correct' ? ' correct' : st==='incorrect' ? ' incorrect' : '');
  }
}

function score(){
  return state[mode].filter(s=>s.status==='correct').length;
}

function render(){
  const item = ITEMS[current];
  const s = state[mode][current];

  // speaker badge
  if(item.sp){ speakerEl.style.display='inline-block'; speakerEl.textContent = item.sp; }
  else { speakerEl.style.display='none'; }

  if(mode === 'ar-de'){
    promptEl.setAttribute('dir','rtl');
    promptEl.textContent = item.ar;
    answerLabelEl.textContent = 'اكتب الترجمة بالألمانية:';
    inputEl.setAttribute('dir','ltr');
    inputEl.placeholder = 'Antwort auf Deutsch …';
  } else {
    promptEl.setAttribute('dir','ltr');
    promptEl.textContent = item.de;
    answerLabelEl.textContent = 'اكتب المعنى بالعربية:';
    inputEl.setAttribute('dir','rtl');
    inputEl.placeholder = 'اكتب المعنى هنا…';
  }

  inputEl.value = s.typed || "";
  inputEl.classList.remove('right','wrong');
  feedbackEl.classList.remove('show','good','bad');
  feedbackEl.innerHTML = "";

  if(s.status === 'correct'){
    inputEl.classList.add('right');
  } else if(s.status === 'incorrect'){
    inputEl.classList.add('wrong');
    showFeedback(false, s.typed, correctAnswer());
  }

  progressText.textContent = `السؤال ${current+1} من ${ITEMS.length}`;
  scoreText.textContent = `صحيح: ${score()}`;
  progressFill.style.width = `${((current+1)/ITEMS.length)*100}%`;

  el('prev-btn').disabled = current === 0;
  el('next-btn').textContent = (current === ITEMS.length-1) ? 'انتهى ✓' : 'التالي ▶';

  updateDots();
  inputEl.focus();
}

function correctAnswer(){
  const item = ITEMS[current];
  return mode === 'ar-de' ? item.de : item.ar;
}

function showFeedback(isCorrect, typed, correct){
  feedbackEl.classList.add('show', isCorrect ? 'good' : 'bad');
  if(isCorrect){
    feedbackEl.innerHTML = `<div class="row">✅ <b>إجابة صحيحة!</b> ينتقل السؤال التالي تلقائيًا…</div>`;
  } else {
    feedbackEl.innerHTML =
      `<div class="row"><span class="tag">إجابتك:</span> ${typed ? escapeHtml(typed) : '<i>(فارغ)</i>'}</div>` +
      `<div class="row"><span class="tag">الإجابة الصحيحة:</span> <b>${escapeHtml(correct)}</b></div>` +
      `<div class="row"><span class="tag">تصحيح:</span> قارن الكلمات وترتيبها مع الإجابة الصحيحة أعلاه، ثم أعد المحاولة حتى تكتبها بشكل صحيح.</div>`;
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function checkAnswer(){
  const item = ITEMS[current];
  const typed = inputEl.value;
  const correct = correctAnswer();
  const ok = normalize(typed) === normalize(correct) && normalize(typed).length > 0;
  state[mode][current] = {status: ok ? 'correct' : 'incorrect', typed};

  if(ok){
    inputEl.classList.remove('wrong'); inputEl.classList.add('right');
    showFeedback(true);
    updateDots();
    scoreText.textContent = `صحيح: ${score()}`;
    setTimeout(()=>{
      if(current < ITEMS.length-1){ current++; render(); }
    }, 700);
  } else {
    inputEl.classList.remove('right'); inputEl.classList.add('wrong');
    showFeedback(false, typed, correct);
    updateDots();
  }
}

el('check-btn').addEventListener('click', checkAnswer);
inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); }});

el('prev-btn').addEventListener('click', ()=>{ if(current>0){ current--; render(); }});
el('next-btn').addEventListener('click', ()=>{ if(current < ITEMS.length-1){ current++; render(); } });

function setMode(newMode){
  mode = newMode;
  switchEl.setAttribute('data-mode', mode);
  el('btn-ar-de').classList.toggle('active', mode==='ar-de');
  el('btn-de-ar').classList.toggle('active', mode==='de-ar');
  render();
}
el('btn-ar-de').addEventListener('click', ()=>setMode('ar-de'));
el('btn-de-ar').addEventListener('click', ()=>setMode('de-ar'));

buildDots();
render();
</script>
</body>
</html>
