<title>Netzwerk A1 · Lektion 1 — اختبار تفاعلي (300+ سؤال)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --wine:#6E1F2B;
    --wine-dark:#4A141C;
    --wine-light:#8C3040;
    --paper:#FAF6EE;
    --card:#FFFFFF;
    --ink:#2B2420;
    --ink-soft:#6b5f55;
    --gold:#C08A34;
    --gold-light:#EBD9B4;
    --sage:#3F7A5C;
    --sage-bg:#E7F2EC;
    --rust:#B23A2E;
    --rust-bg:#FBEAE7;
    --line:#E4D9C5;
    --radius:14px;
  }/* =========================
   Page Animation
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    animation: pageLoad 0.8s ease-in-out;
}

/* حركة دخول الصفحة */
@keyframes pageLoad {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   كل العناصر
========================= */

.container,
.row,
.card,
.form-control,
.btn,
input,
textarea,
select,
img,
h1,
h2,
h3,
h4,
h5,
h6,
p {
    transition: all 0.35s ease;
}


/* =========================
   Cards
========================= */

.card {
    animation: cardShow 0.7s ease both;
}

@keyframes cardShow {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
}


/* =========================
   Images
========================= */

.card img {
    transition: transform 0.5s ease;
}

.card:hover img {
    transform: scale(1.05);
}


/* =========================
   Buttons
========================= */

.btn {
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-3px);
}

.btn:active {
    transform: scale(0.95);
}


/* =========================
   Inputs
========================= */

.form-control {
    transition: all 0.3s ease;
}

.form-control:focus {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 123, 255, 0.15);
}


/* =========================
   Hover على العناصر
========================= */

input:hover,
textarea:hover,
select:hover {
    transform: translateY(-1px);
}


/* =========================
   ظهور المنتجات واحد وراء الثاني
========================= */

.card:nth-child(1) {
    animation-delay: 0.1s;
}

.card:nth-child(2) {
    animation-delay: 0.2s;
}

.card:nth-child(3) {
    animation-delay: 0.3s;
}

.card:nth-child(4) {
    animation-delay: 0.4s;
}

.card:nth-child(5) {
    animation-delay: 0.5s;
}

.card:nth-child(6) {
    animation-delay: 0.6s;
}


/* =========================
   تحسين شكل الصفحة
========================= */

body {
    overflow-x: hidden;
}

::selection {
    background: #0d6efd;
    color: white;
}


/* =========================
   عند الضغط على أي زر
========================= */

button {
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

  body{

    background:var(--paper);

  .scorebar .chip.wrong{color:var(--rust);}
  .scorebar .chip.left{color:var(--ink-soft);}
  .scorebar .chip.total{color:var(--gold);}

  .cat-chip{
    flex:0 0 auto; background:var(--card); border:1.5px solid var(--line); color:var(--ink-soft);

  .cat-chip.active{background:var(--wine); border-color:var(--wine); color:#fff;}
  .cat-chip.active .n{background:rgba(255,255,255,.25); color:#fff;}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:0 8px 24px rgba(74,20,28,0.08); position:relative; overflow:hidden; border:1px solid var(--line);}

  .card-inner{padding:34px 26px 26px;}
  .cat-label{color:var(--gold); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px;}

  .q-text .de{font-weight:700; color:var(--wine-dark);}
  .q-passage{
    background:#fff8ec; border:1px solid var(--gold-light); border-radius:10px; padding:14px 16px;

  }

  .options{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .opt{border:1.5px solid var(--line); background:#fffdf9; border-radius:10px; padding:13px 16px; cursor:pointer; font-size:15px; transition:.15s; display:flex; align-items:center; gap:10px;}
  .opt:hover{border-color:var(--gold); background:#fff8ec;}
  .opt.selected{border-color:var(--wine); background:var(--gold-light);}
  .opt .bullet{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-soft); flex:0 0 auto;}
  .opt.selected .bullet{border-color:var(--wine); background:radial-gradient(circle,var(--wine) 0 45%, transparent 50%);}

  .fillrow{display:flex; gap:10px; margin-bottom:18px;}
  input.fillinput{flex:1; padding:13px 16px; border-radius:10px; border:1.5px solid var(--line); font-size:16px; font-family:'Inter',sans-serif; direction:ltr; text-align:right;}
  input.fillinput:focus{outline:none; border-color:var(--wine);}

  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  button{font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:10px; padding:12px 22px; cursor:pointer; transition:.15s;}
  .btn-check{background:var(--wine); color:#fff;}
  .btn-check:hover{background:var(--wine-dark);}
  .btn-next{background:var(--gold); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}

  .feedback{margin-top:18px; padding:14px 16px; border-radius:10px; font-size:14.5px; font-weight:700; display:none; align-items:flex-start; gap:10px; line-height:1.6;}
  .feedback.show{display:flex;}

  .feedback .fico{font-size:18px; line-height:1;}

    .brand .title{font-size:18px;}
    .q-text{font-size:16px;}

  "sprechen": ["spreche","sprichst","spricht","sprechen","sprecht","sprechen"]
};

const PRONOUNS = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];

  PRONOUNS.forEach((pron,i)=>{
    const form = VERB_TABLE[verb][i];
    QUESTIONS.push({
      cat:"الأفعال", type:"fill",
      q:`كمّل تصريف الفعل: "${pron} ___" — (${verb} = ${VERB_MEANING[verb]})`,
      accept:[form, form.replace(/ß/g,"ss")]
    });
  });
});

];

});

const STORAGE_KEY = "netzwerk_quiz_progress_v1";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveProgress(){
  try{
    const compact = state.map(q=>({correct:q.correct, done:q.done, attempts:q.attempts}));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
  }catch(e){ /* تجاهل لو التخزين مش متاح */ }
}
function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function pickDistractors(field, correctVal, count){
  const pool = PHRASE_BANK.map(p=>p[field]).filter(v=>v!==correctVal);
  const shuffled = pool.sort(()=>Math.random()-0.5);
  const uniq = [...new Set(shuffled)];
  return uniq.slice(0, count);
}
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

PHRASE_BANK.forEach(item=>{
  // 1) عربي → ألماني (كتابة)
  QUESTIONS.push({
    cat:"ترجمة عربي→ألماني", type:"fill",
    q:`ترجم للألماني: "${item.ar}"`,
    accept:[item.de, item.de.replace(/ß/g,"ss")]
  });
  // 2) ألماني → عربي (اختيار من متعدد)
  {
    const opts = shuffleArr([item.ar, ...pickDistractors("ar", item.ar, 3)]);
    QUESTIONS.push({
      cat:"ترجمة ألماني→عربي", type:"mcq",
      q:`إيه معنى الجملة دي؟ "${item.de}"`,
      options:opts, answer:opts.indexOf(item.ar)
    });
  }
});

let state = QUESTIONS.map((q,i)=>({...q, idx:i, done:false, correct:false, attempts:0}));

// استرجاع التقدّم المحفوظ (لو موجود) بعد إعادة فتح الصفحة
(function restoreProgress(){
  const saved = loadProgress();
  if(saved && Array.isArray(saved) && saved.length===state.length){
    state.forEach((q,i)=>{
      q.correct = !!saved[i].correct;
      q.done = !!saved[i].done;
      q.attempts = saved[i].attempts||0;
    });
  }
})();

let categories = ["الكل", ...new Set(QUESTIONS.map(q=>q.cat))];
let activeCat = "الكل";
let currentIdx = 0;
let selectedOption = null;

function restartAll(){
  if(!confirm("متأكد إنك عايز تبدأ من الأول؟ هيتصفّر كل تقدّمك المحفوظ.")) return;
  state.forEach(q=>{ q.correct=false; q.done=false; q.attempts=0; });
  clearProgress();
  activeCat = "الكل";
  currentIdx = 0;
  renderCats();
  renderQuestion();
}

function filteredList(){
  return activeCat==="الكل" ? state : state.filter(q=>q.cat===activeCat);
}
function normalize(str){
  return str.toString().trim().toLowerCase()
    .replace(/ß/g,"ss")
    .replace(/[؟?!.,]/g,"")
    .replace(/\s+/g," ");
}
function catCount(c){
  return c==="الكل" ? state.length : state.filter(q=>q.cat===c).length;
}
function renderCats(){
  const bar = document.getElementById('catBar');
  bar.innerHTML = "";
  categories.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (c===activeCat ? ' active':'');
    chip.innerHTML = `${c} <span class="n">${catCount(c)}</span>`;
    chip.onclick = ()=>{ activeCat=c; currentIdx=0; renderCats(); renderQuestion(); updateScorebar(); };
    bar.appendChild(chip);
  });
}
function updateScorebar(){
  const list = filteredList();
  const correct = list.filter(q=>q.correct).length;
  const wrongDone = list.filter(q=>q.done && !q.correct).length;
  const left = list.filter(q=>!q.correct).length;
  document.getElementById('scTotal').textContent = list.length;
  document.getElementById('scCorrect').textContent = correct;
  document.getElementById('scWrong').textContent = wrongDone;
  document.getElementById('scLeft').textContent = left;
  const posDone = Math.min(currentIdx+1, list.length);
  document.getElementById('pillText').textContent = `${posDone} من ${list.length}`;
}
function renderQuestion(){
  const area = document.getElementById('quizArea');
  const list = filteredList();
  if(list.length===0){
    area.innerHTML = `<div class="card"><div class="card-inner"><p>مفيش أسئلة في القسم ده.</p></div></div>`;
    return;
  }
  const remaining = list.filter(q=>!q.correct);
  if(remaining.length===0){
    area.innerHTML = `
      <div class="card"><div class="card-inner endcard">
        <div class="big">🎉</div>
        <h2>خلصت كل أسئلة "${activeCat}"!</h2>
        <p>عدد الأسئلة: ${list.length} — كلها صح دلوقتي.</p>
        <button class="btn-ghost" onclick="resetCategory()">إعادة المحاولة في هذا القسم</button>
      </div></div>`;
    return;
  }
  if(currentIdx >= remaining.length) currentIdx = 0;
  const q = remaining[currentIdx];
  selectedOption = null;

  let passageHTML = q.passage ? `<div class="q-passage de" lang="de">${q.passage}</div>` : "";
  let bodyHTML = "";
  if(q.type==="mcq"){
    bodyHTML = `<div class="options" id="optsWrap">` +
      q.options.map((opt,i)=>`
        <div class="opt" data-i="${i}" onclick="selectOpt(${i})">
          <span class="bullet"></span><span class="de" lang="de">${opt}</span>
        </div>`).join("") +
      `</div>`;
  } else {
    bodyHTML = `<div class="fillrow">
      <input type="text" class="fillinput de" lang="de" id="fillInput" placeholder="اكتب إجابتك هنا بالألماني...">
    </div>`;
  }

  area.innerHTML = `
    <div class="card">
      <div class="corner-tab">${q.idx+1}</div>
      <div class="card-inner">
        <div class="cat-label">${q.cat}</div>
        ${passageHTML}
        <div class="q-text">${q.q}</div>
        ${bodyHTML}
        <div class="actions">
          <button class="btn-check" id="checkBtn" onclick="checkAnswer()">✓ تحقق من الإجابة</button>
          <button class="btn-ghost" onclick="skipQuestion()">تخطي ⏭</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  `;

  if(q.type==="fill"){
    const inp = document.getElementById('fillInput');
    inp.addEventListener('keydown', e=>{ if(e.key==="Enter") checkAnswer(); });
    setTimeout(()=>inp.focus(), 50);
  }
  updateScorebar();
}
function selectOpt(i){
  selectedOption = i;
  document.querySelectorAll('.opt').forEach(el=>el.classList.remove('selected'));
  document.querySelector(`.opt[data-i="${i}"]`).classList.add('selected');
}
function checkAnswer(){
  const list = filteredList();
  const remaining = list.filter(q=>!q.correct);
  if(currentIdx>=remaining.length) return;
  const q = remaining[currentIdx];
  q.attempts++;
  let isCorrect = false;

  if(q.type==="mcq"){
    if(selectedOption===null){
      showFeedback(false, "اختار إجابة الأول قبل ما تتحقق!", "");
      return;
    }
    isCorrect = selectedOption === q.answer;
  } else {
    const val = document.getElementById('fillInput').value;
    if(!val.trim()){
      showFeedback(false, "اكتب إجابة الأول!", "");
      return;
    }
    isCorrect = q.accept.some(a=> normalize(a)===normalize(val));
  }

  if(isCorrect){
    q.correct = true; q.done = true;
    showFeedback(true, "إجابة صح! أحسنت 👏", "");
    updateScorebar();
    saveProgress();
    setTimeout(()=>{ renderQuestion(); }, 900);
  } else {
    q.done = true;
    let hint = "";
    if(q.attempts>=2){
      const correctText = q.type==="mcq" ? q.options[q.answer] : q.accept[0];
      hint = `الإجابة الصحيحة: <span class="de" lang="de">${correctText}</span>`;
    } else {
      hint = "حاول تاني — راجع تصريف الفعل أو القاعدة.";
    }
    showFeedback(false, "❌ Error: إجابة غلط", hint);
    updateScorebar();
    saveProgress();
  }
}
function showFeedback(ok, title, sub){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok?'success':'error');
  fb.innerHTML = `<span class="fico">${ok?'✅':'⚠️'}</span><div>${title}${sub?`<small>${sub}</small>`:''}</div>`;
}
function skipQuestion(){
  const list = filteredList();
  const remaining = list.filter(q=>!q.correct);
  if(remaining.length<=1) return;
  currentIdx = (currentIdx+1) % remaining.length;
  renderQuestion();
}
function resetCategory(){
  filteredList().forEach(q=>{ q.correct=false; q.done=false; q.attempts=0; });
  currentIdx = 0;
  renderQuestion();
  saveProgress();
}

renderCats();
renderQuestion();
</script>
